<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2d6a4f" />
    <meta name="description" content="Reserva directa na Casa do Penedo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Penedo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Casa do Penedo — Reservar</title>
    <link rel="manifest" href="/manifest.webmanifest" id="app-manifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" id="app-icon" />
    <link rel="apple-touch-icon" href="/icon-192.png" id="app-apple-icon" />
    <script>
      // Chrome Android lê o manifest cedo — ajustar antes do React se a URL for /gestao.
      (function () {
        if (location.pathname.indexOf("/gestao") !== 0) return;
        var m = document.getElementById("app-manifest");
        var i = document.getElementById("app-icon");
        var a = document.getElementById("app-apple-icon");
        if (m) m.setAttribute("href", "/manifest-gestao.webmanifest");
        if (i) i.setAttribute("href", "/icon-gestao-192.png");
        if (a) a.setAttribute("href", "/icon-gestao-192.png");
        document.title = "Casa do Penedo — Gestão";
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute("content", "#1a1a1a");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
